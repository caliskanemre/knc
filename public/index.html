      <script>

          function gtag(){dataLayer.push(arguments);}

          // Set default consent to 'denied' and initialize gtag
          gtag('consent', 'default', {
              'ad_storage': 'denied',
              'analytics_storage': 'denied',
              'wait_for_update': 500,
          });
          gtag('js', new Date());
          gtag('config', 'G-41P0XLVW05');
      </script>
      <!-- Consent Update Functions -->
      <script>
          function allConsentGranted() {
              gtag('consent', 'update', {
                  'ad_storage': 'granted',

              });
          }
      </script>
      <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

      <link rel="stylesheet" href="index.css">

            async

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
    <div id="consentModal" class="consent-modal">
        <div class="consent-modal-content">
            <p>We use cookies to personalize content and ads, to provide social media features, and to analyze our traffic. Partners who may combine it with other information that you’ve provided to them or that they’ve collected</p>
            <div class="consent-buttons">
                <button id="denyAll" class="btn-deny">Deny</button>
                <button id="acceptAll" class="btn-accept">Accept All</button>
            </div>
        </div>
    </div>

    <script>
        // Function to show the consent modal
        function showConsentModal() {
            document.getElementById('consentModal').style.display = 'block';
        }

        // Function to hide the consent modal
        function hideConsentModal() {
            document.getElementById('consentModal').style.display = 'none';
        }

        // Handling 'Accept All' button click
        document.getElementById('acceptAll').addEventListener('click', function() {
            allConsentGranted(); // Grant all consents
            hideConsentModal();  // Hide the consent modal
        });

        // Handling 'Deny' button click (You may need to define what happens when all consents are denied)
        document.getElementById('denyAll').addEventListener('click', function() {
            hideConsentModal();  // Hide the consent modal
            // Implement what should happen when consents are denied
        });

        // Show the consent modal when the page loads
        window.onload = function() {
            showConsentModal();
        };
    </script>
