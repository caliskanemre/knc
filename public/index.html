    <script>
      // Early redirect: If path has no /en or /tr prefix, redirect based on browser language
      (function() {
        try {
          var path = window.location.pathname || '/';
          var hasLangPrefix = /^\/(en|tr)(\/|$)/i.test(path);
          if (!hasLangPrefix) {
            var navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            var targetLang = navLang.indexOf('tr') === 0 ? 'tr' : 'en';
            var newPath = '/' + targetLang + (path.startsWith('/') ? path : ('/' + path));
            var search = window.location.search || '';
            var hash = window.location.hash || '';
            if (newPath === '/tr' || newPath === '/en') newPath += '/';
            window.location.replace(newPath + search + hash);
          }
        } catch (e) { /* no-op */ }
      })();
    </script>

    <style id="critical-css">
      /* Critical Path CSS - Above the fold styles */

      /* Font Variables */
      :root {
        --font-primary: 'Lora', serif;
        --font-heading: 'Playfair Display', serif;
        --font-ui: 'Inter', sans-serif;
        --font-brand: 'Dancing Script', cursive;
        --fw-normal: 400;
        --fw-medium: 500;
        --fw-semibold: 600;
        --fw-bold: 700;
        --ls-normal: 0;
        --ls-tight: -0.025em;
        --ls-wide: 0.025em;
      }

      /* Base styles */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--font-primary);
        font-weight: var(--fw-normal);
        line-height: 1.6;
        letter-spacing: var(--ls-normal);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color: #333;
        background-color: #fff;
      }

      /* Header/Navbar Critical Styles */
      .navbar {
        background-image: linear-gradient(to right, #f0f0f0, #ffffff);
        font-family: var(--font-ui);
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 2rem;
        position: relative;
        z-index: 1000;
      }

      .navbar-brand {
        font-family: var(--font-brand);
        font-size: 1.5rem;
        font-weight: var(--fw-bold);
        color: #333;
        text-decoration: none;
      }

      .nav-link {
        font-family: var(--font-primary);
        font-size: 1rem;
        font-weight: var(--fw-normal);
        color: #666;
        margin: 0 0.5rem;
        padding-bottom: 0.25rem;
        text-decoration: none;
        transition: color 0.3s ease, border-bottom-color 0.3s ease;
      }

      .nav-link:hover, .nav-link.active {
        color: #000;
        border-bottom: 2px solid #ff5722;
        font-weight: bold;
      }

      .navbar-icons {
        font-size: 1.2rem;
        color: #666;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .navbar-icons:hover {
        background-color: #eee;
        border-radius: 50%;
        padding: 0.5rem;
      }

      /* Typography Critical Styles */
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        font-weight: var(--fw-semibold);
        letter-spacing: var(--ls-tight);
        line-height: 1.2;
        color: #2c2c2c;
        margin: 0;
      }

      h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: var(--fw-bold);
      }

      h2 {
        font-size: clamp(1.75rem, 4vw, 2.75rem);
      }

      /* Loading states to prevent layout shift */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Mobile responsive navbar */
      @media only screen and (max-width: 768px) {
        .navbar {
          padding: 0.5rem 1rem;
        }

        .navbar-brand {
          font-size: 2rem;
        }

        .desktop-app-title {
          display: none;
        }

        .nav-link.nav-item {
          margin-left: 15px;
          font-size: 1.4rem;
        }

        .sub-header {
          display: flex;
          justify-content: space-around;
          padding: 10px;
          background-color: #f8f8f8;
        }

        .search-desktop-image {
          display: none;
        }

        .search-mobile-image {
          display: block;
          cursor: pointer;
          margin-top: 5px;
          margin-right: 5px;
        }
      }

      @media only screen and (min-width: 768px) {
        .mobile-app-title {
          display: none;
        }

        .nav-link.nav-item {
          margin-left: 40px;
          font-size: 1.9rem;
        }

        .sub-header {
          display: none;
        }

        .search-mobile-image {
          display: none;
        }
      }

      /* Prevent flash of unstyled content */
      .MuiListItemText-primary {
        font-family: var(--font-primary) !important;
      }

      /* Loading skeleton to prevent layout shift */
      .content-skeleton {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }

      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>

    <script>
      function setDynamicMetaDescription() {
        const path = window.location.pathname;
        let description, title, lang;
        if (path.includes('/en/')) {
          lang = 'en';
          description = "Henna product discovery with Kınasepeti! Uncover personalized henna sets, handkerchiefs, veils, ornaments and gifts tailored to your interests";
          title = "Kınasepeti - Personalized Wedding and Henna Night Products";
        } else {
          lang = 'tr';
          description = "Kınasepeti ile kına gecesi ürünlerini keşfedin! İlgi alanlarınıza uygun kişiselleştirilmiş kına setleri, mendiller, duvaklar, süsler ve hediyeleri keşfedin";
          title = "Kınasepeti - Kişiselleştirilmiş Düğün ve Kına Hediyeleri";
        }
        document.querySelector('meta[name="description"]').setAttribute('content', description);
        document.title = title;
        document.documentElement.lang = lang;
      }
      // Set initial meta description on DOMContentLoaded to ensure elements exist
      document.addEventListener('DOMContentLoaded', setDynamicMetaDescription);
      window.addEventListener('popstate', setDynamicMetaDescription);
    </script>
